# Everything the brief does is driven by rules in this file. No AI involved.
timezone = "America/Los_Angeles"
slots = [7, 12]          # local hours at which a brief is sent
recipient = ""           # empty = the primary account's own address

[persona]
name = "Bruno"           # who the messages come from (try "Jarvis"); wording lives in phrases.toml
user = "Zaki"
address = "sir"          # how he addresses you in phrases.toml ({sir})

[brief]
telegram_max_priority = 3   # Telegram stays short: only this many urgent items...
telegram_max_events = 4     # ...and this many of today's events; the rest is in the email

[delivery]
channels = ["telegram", "email"]   # each is tried independently; email is the full version
telegram_redact_health = true      # Telegram only says "N health items"; details stay in email

# One entry per Gmail/Calendar login. Each needs its own refresh token secret
# (run auth_setup.py once per account). The first account with send_from=true sends the brief.
[[accounts]]
name = "zshake21"
email = "zshake21@gmail.com"
token_env = "GOOGLE_REFRESH_TOKEN"
send_from = true
[[accounts]]
name = "zakisheikh21"
email = "zakisheikh21@gmail.com"
token_env = "GOOGLE_REFRESH_TOKEN_2"

[calendar]
exclude_calendars = ["Holidays in United States", "Birthdays", "Phases of the Moon", "Prayer Times", "Muslim Holidays", "Zaheer Calendar", "Family"]
partner_emails = ["narjisirfan@gmail.com"]   # events created by these people are tagged with partner_label
partner_label = "Narjis"
lookahead_days = 7
# Calendars whose every event is an assignment (e.g. the subscribed Canvas feed). Fill in the calendar's name.
# Canvas feeds import as all-day events titled "<assignment> [<COURSE>]"; the date is the due date.
homework_calendars = ["Zaki Sheikh Calendar (Canvas)"]
# Canvas items that are not assignments (shown as notices). Timed (non all-day) Canvas events are notices too.
notice_pattern = '(?i)\b(poll|survey|vote|office hours|announcement)\b'
# Dropped entirely (you chose not to hear about these).
homework_exclude_pattern = '(?i)\b(enrollment|advising|registration)\b'
# Assignments matching this are listed separately so they stand out.
exam_pattern = '(?i)\b(exam|quiz|midterm|final exam|presentation|test)\b'
course_tag_is_homework = true             # any event ending in a [COURSE] tag counts (Canvas copies in your main calendar too)
# For all other calendars, events matching this are treated as homework.
homework_pattern = '(?i)\b(homework|assignment|hw ?\d+|quiz|exam|midterm|essay|problem set|pset|lab report|worksheet)\b'

[calendar.course_aliases]                 # substring of the course tag -> short name shown in the brief
"CS549" = "ML"
"CS-157B" = "Databases"
"EXSC 126B" = "Exercise Sci"

[bills]
lookback_days = 40       # how far back to look for an unpaid "payment due" notice
window_days = 14        # bills are mentioned only when due within this many days
due_soon_days = 3        # "needs attention" when due within this many days (or overdue)
overdue_grace_days = 5   # a due date older than this with no payment notice is assumed paid (autopay etc.) and dropped

[mail]
max_per_section = 8

# ---------------------------------------------------------------------------
# Billers: learned from real mail. A biller matches on SENDER, then each rule matches the
# SUBJECT in order; first hit wins. events:
#   due        a payment is coming due (amount/due date read from the body, autopay flagged)
#   statement  a statement/bill is available
#   paid       payment received/scheduled/confirmed (also settles an earlier "due")
#   balance    periodic balance alert (collapsed to the latest one)
#   alert      fraud / declined / needs action -> Needs attention
#   receipt    counted, not listed;   info  listed under Other;   ignore  dropped
# ---------------------------------------------------------------------------
[[billers]]
name = "Chase"
kind = "card"
from = '(?i)no\.?reply\.?alerts@chase\.com'
rules = [
  { subject = '(?i)payment is due', event = "due" },
  { subject = '(?i)statement is available', event = "statement" },
  { subject = '(?i)(received|posted|scheduled) your .*payment|payment (was )?(received|posted|scheduled)', event = "paid" },
  { subject = '(?i)balance is \$', event = "ignore" },
  { subject = '(?i)fraud|unusual|suspicious|declin|security|locked', event = "alert" },
  { subject = '(?i)credit limit|offer|reward', event = "ignore" },
  { subject = '(?i)new letter', event = "info" },
]
[[billers]]
name = "Chase offers"
kind = "card"
from = '(?i)mcmap\.chase\.com|chasetravel\.com'
rules = [{ subject = '.', event = "ignore" }]

[[billers]]
name = "Synchrony"
kind = "card"
from = '(?i)synchrony(bank)?\.com'
rules = [
  { subject = '(?i)payment is due|payment due', event = "due" },
  { subject = '(?i)statement is ready', event = "statement" },
  { subject = '(?i)scheduled a payment|payment (received|posted)|thank', event = "paid" },
  { subject = '.', event = "ignore" },
]
[[billers]]
name = "Fairwinds"
kind = "card"
from = '(?i)fairwinds\.org'
rules = [
  { subject = '(?i)payment.*due|due', event = "due" },
  { subject = '(?i)statement', event = "statement" },
]
[[billers]]
name = "Bank of America"
kind = "card"
from = '(?i)bankofamerica\.com'
rules = [
  { subject = '(?i)payment.*due', event = "due" },
  { subject = '(?i)statement is available', event = "statement" },
  { subject = '(?i)fraud|declin|alert|unusual', event = "alert" },
]
[[billers]]
name = "Patelco"
kind = "bank"
from = '(?i)patelco\.org|services\.pscu\.com'
rules = [
  { subject = '(?i)balance summary', event = "ignore" },
  { subject = '(?i)fraud|declin|unusual|overdraft|low balance', event = "alert" },
]
[[billers]]
name = "Verizon"
kind = "phone"
from = '(?i)verizonwireless\.com|verizon\.com'
rules = [
  { subject = '(?i)received your payment|payment confirmed', event = "paid" },
  { subject = '(?i)bill is (ready|available)|payment.*due|past due', event = "due" },
  { subject = '.', event = "ignore" },
]
[[billers]]
name = "Rent (Essex)"
kind = "rent"
from = '(?i)@essex\.com|rentcafe\.com|appfolio'
rules = [
  { subject = '(?i)rent payment is due|rent.*due|payment.*due', event = "due" },
  { subject = '(?i)payment (received|confirmation)|receipt', event = "paid" },
  { subject = '(?i)late|past due', event = "alert" },
  { subject = '.', event = "admin" },
]
[[billers]]
name = "Conservice utilities"
kind = "utility"
from = '(?i)conservicemail\.com'
rules = [{ subject = '(?i)statement', event = "due" }]
[[billers]]
name = "Renters insurance"
kind = "insurance"
from = '(?i)mercuryinsurance\.com'
rules = [
  { subject = '(?i)new .*insurance bill', event = "due" },
  { subject = '(?i)policy documents', event = "ignore" },
]
[[billers]]
name = "Aetna"
kind = "health"
from = '(?i)aetna\.com'
rules = [
  { subject = '(?i)explanation of benefits', event = "statement" },
  { subject = '.', event = "ignore" },
]
[[billers]]
name = "AFC Urgent Care"
kind = "health"
from = '(?i)afcurgentcare'
rules = [
  { subject = '(?i)paperless|your visit', event = "ignore" },
  { subject = '(?i)bill|balance|statement|amount', event = "due" },
]
[[billers]]
name = "Venmo"
kind = "p2p"
from = '(?i)venmo\.com'
rules = [
  { subject = '(?i)requests|charged you|reminder', event = "due" },
  { subject = '(?i)you paid|completed|you received|sent you', event = "receipt" },
]
[[billers]]
name = "TurboTax (muted)"
kind = "marketing"
from = '(?i)turbotax|intuit\.com'
rules = [{ subject = '.', event = "ignore" }]
[[billers]]
name = "ChargePoint (muted)"
kind = "marketing"
from = '(?i)chargepoint\.com'
rules = [{ subject = '.', event = "ignore" }]
[[billers]]
name = "Receipts and orders (muted)"
kind = "marketing"
from = '(?i)invoice@mail\.anthropic\.com|googleplay-noreply|orders\.apple\.com|ziosk|amazon\.com|shopifyemail'
rules = [{ subject = '.', event = "ignore" }]
[[billers]]
name = "Investments and newsletters (muted)"
kind = "marketing"
from = '(?i)fidelity\.com|beehiiv\.com|creditkarma\.com|historyfacts|mcmap'
rules = [{ subject = '.', event = "ignore" }]
[[billers]]
name = "United"
kind = "travel"
from = '(?i)united\.com'
rules = [{ subject = '.', event = "travel" }]
[[billers]]
name = "Hertz"
kind = "travel"
from = '(?i)hertz\.com'
rules = [{ subject = '.', event = "travel" }]
[[billers]]
name = "Booking.com"
kind = "travel"
from = '(?i)booking\.com'
rules = [{ subject = '.', event = "travel" }]

# ---------------------------------------------------------------------------
# Generic keyword rules: catch mail from senders not listed above. Subject/snippet only.
# ---------------------------------------------------------------------------
[mail.rules.health]
sender = []
text   = ['(?i)explanation of benefits', '(?i)patient (balance|statement)', '(?i)medical (bill|statement)', '(?i)claim (processed|denied)', '(?i)\bcopay\b',
          '(?i)lab results?', '(?i)test results?', '(?i)appointment (reminder|confirmed|scheduled)', '(?i)visit summary', '(?i)\bmychart\b']
[mail.rules.card]
sender = []
text   = ['(?i)statement (is )?(ready|available)', '(?i)minimum payment', '(?i)(fraud|unusual|suspicious) (activity|alert|transaction)', '(?i)\bautopay\b']
[mail.rules.bill]
sender = []
text   = ['(?i)\binvoice\b', '(?i)past due|overdue', '(?i)amount due', '(?i)bill is (ready|available)', '(?i)payment (reminder|failed|declined)', '(?i)final notice']
[mail.rules.receipt]
sender = []
text   = ['(?i)\breceipt\b', '(?i)order confirmation']
[mail.rules.logistics]
sender = []
text   = ['(?i)\bflight\b', '(?i)itinerary', '(?i)check-?in', '(?i)reservation', '(?i)boarding']
[mail.rules.renewal]
sender = []
text   = ['(?i)\brenews?\b', '(?i)renewal', '(?i)auto-?renew', '(?i)trial (ends|ending|expires)', '(?i)will be charged', '(?i)your subscription']
[mail.rules.action]
sender = []
text   = ['(?i)action (needed|required)', '(?i)respond by', '(?i)please confirm', '(?i)verify your', '(?i)update your .* by']
[mail.rules.government]
sender = ['(?i)\.gov\b|\bdmv\b|\birs\b|courts?\.']
text   = ['(?i)notice of', '(?i)summons', '(?i)jury', '(?i)\bIRS\b', '(?i)\bDMV\b', '(?i)court date']
[mail.rules.community]
sender = ['(?i)camphujjah|noorcollective|masjid|mosque']
text   = ['(?i)\bzakat\b', '(?i)donation', '(?i)\bcamp\b.*(invoice|payment|balance)', '(?i)(mosque|masjid|foundation)']
